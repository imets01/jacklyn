# Fallback for funds without provider data (no Eulerpool key, or a fund Eulerpool doesn't know): countries are
# approximated from the index a fund tracks, matched against its name (case-insensitive regex). First match
# wins; `not_pattern` excludes. `broad` is used either way.
# `countries = "benchmark"` means: spread like MSCI ACWI. `broad = true` marks a fund diversified on its own.
[[index]]
pattern = "all.?world|acwi|msci world|ftse developed world"
label = "Global index (spread like MSCI ACWI)"
broad = true
countries = "benchmark"

[[index]]
pattern = "s&p 500|msci usa|total stock market|russell 3000"
not_pattern = "sector"
label = "Broad US index"
broad = true
countries = { "United States" = "1" }

[[index]]
pattern = "s&p 500|nasdaq.?100|msci usa|russell"
label = "US index (narrow)"
broad = false
countries = { "United States" = "1" }

[[index]]
pattern = '\bjapan\b|topix|nikkei'
label = "Japan index"
broad = false
countries = { "Japan" = "1" }

[[index]]
pattern = '\bspi\b|\bsmi\b|swiss|switzerland'
label = "Swiss index"
broad = false
countries = { "Switzerland" = "1" }

[[index]]
pattern = "ftse 100|msci uk"
label = "UK index"
broad = false
countries = { "United Kingdom" = "1" }

[[index]]
pattern = "stoxx europe 600|msci europe|ftse developed europe|euro stoxx"
label = "Europe index (country split not available)"
broad = true
countries = { "Europe (broad, not split)" = "1" }
