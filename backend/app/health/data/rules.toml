# Portfolio Health rules. Every finding on the Health page comes from one of these rules: a metric computed
# deterministically from your holdings, compared against the thresholds below. Edit thresholds freely.
#
# Rule fields
#   id, title     stable identifier and display name
#   metric        name of a metric computed in app/health/metrics.py
#   format        how values and thresholds are shown: percent | points | count | multiple
#   levels        checked worst-first; the first that matches sets the severity
#                 severity: good | info | warning | problem    op: > >= < <=
#   message       shown with the finding; {value} {threshold} and metric context keys are filled in
#   pass_message  optional: shown as a strength when no warning/problem/info level matches
#   explanation   plain-language "why" (shown under "Why?")
#   threshold_note  honest note on where the number comes from (source vs. Jacklyn default)
#   citations     title, publisher, year, url, optional note

[score]
start = 100
# Points subtracted per finding; info and good findings never change the score.
penalties = { problem = 15, warning = 5 }

[rebalancing]
# A category is "in band" while its weight is within the smaller of these of its target.
absolute_band = "0.05"
relative_band = "0.25"

[profile]
# Linear approximation of Vanguard's target-date glide path (Figure 2 in the 2019 paper): 90% equity until
# 25 years before the target date, 50% at the target date, falling to 30% over the following 7 years.
glide_start_equity = "0.90"
glide_years = 25
glide_target_equity = "0.50"
glide_floor_equity = "0.30"
glide_floor_years = 7
# Jacklyn convention (not from a source): how the stated risk tolerance shifts the equity share.
risk_adjustments = { conservative = "-0.20", balanced = "-0.10", growth = "0", aggressive = "0.10" }
glide_citation = "vanguard_tdf"

