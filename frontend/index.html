<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1713" media="(prefers-color-scheme: dark)" />
    <title>Jacklyn</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      ;(function () {
        try {
          var pref = localStorage.getItem('jacklyn.theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
